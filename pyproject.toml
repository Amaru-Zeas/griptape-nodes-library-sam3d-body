[project]
name = "sam3d_body_nodes"
version = "0.1.0"
description = "Griptape Nodes library for Meta SAM 3D Body: video mesh recovery, pose smoothing, face expressions, and GLB/BVH export"
authors = [
    {name = "Griptape Community", email = "community@griptape.ai"}
]
readme = "README.md"
requires-python = "~=3.12"
dependencies = [
    "griptape-nodes",
    "numpy>=1.26.0",
]

[tool.uv.sources]
griptape-nodes = { git = "https://github.com/griptape-ai/griptape-nodes", rev = "latest" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sam3d_body_nodes"]
